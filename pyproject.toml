[project]
name = "opensource-scout"
version = "0.1.0"
description = "A local-first AI engineering assistant for discovering, evaluating, and completing high-quality open-source contributions."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Hannan Razzaghi" }]
dependencies = [
    "typer>=0.15",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "httpx>=0.27",
    "tenacity>=9.0",
    "rich>=13.9",
    "openai>=1.54",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "pathspec>=0.12",
]

[project.scripts]
oss = "opensource_scout.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opensource_scout"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "respx>=0.21",
    "ruff>=0.7",
    "pyright>=1.1",
    "pre-commit>=4.0",
    "detect-secrets>=1.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/opensource_scout"]
branch = true

[tool.coverage.report]
skip_empty = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
